<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur (500) - SEPA26</title>
    <link rel="stylesheet" th:href="@{/sepa26.css}">
</head>
<body>

    <!-- Barre de navigation -->
    <div th:replace="~{fragments/layout :: nav}"></div>

    <main class="container">
        <div class="error-card">
            <div class="error-code">500</div>
            <h2>Erreur interne du serveur</h2>
            <p>Une erreur inattendue est survenue lors du traitement de votre demande.</p>
            <p style="margin-top: 25px;">
                <a th:href="@{/}" class="btn">Retour à l'accueil</a>
                <a th:href="@{/help}" class="btn btn-secondary">Consulter l'aide de l'API</a>
            </p>
        </div>
    </main>

    <!-- Pied de page -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
