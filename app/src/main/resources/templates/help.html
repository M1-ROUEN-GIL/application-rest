<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aide - Projet SEPA26</title>
    <link rel="stylesheet" th:href="@{/sepa26.css}">
</head>
<body>

    <!-- Barre de navigation -->
    <div th:replace="~{fragments/layout :: nav}"></div>
    
    <header>
        <h1>Documentation du service REST SEPA26</h1>
        <p><a th:href="@{/}">&larr; Retour à l'accueil</a></p>
    </header>
    
    <main class="container">
        <div th:each="endpoint : ${endpoints}" class="endpoint">
            <h2 th:text="${endpoint['url']}">/sepa26/endpoint</h2>

            <dl class="endpoint-details">
                <dt>Méthode :</dt>
                <dd><strong th:text="${endpoint['method']}">GET</strong></dd>

                <dt>Opération :</dt>
                <dd th:text="${endpoint['operation']}">Description de l'opération</dd>

                <dt>Format de retour :</dt>
                <dd th:text="${endpoint['return']}">XML / HTML</dd>
            </dl>

            <div class="description" th:utext="${endpoint['description']}">
                Description détaillée de l'endpoint...
            </div>
        </div>
    </main>
    
    <!-- Pied de page -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
