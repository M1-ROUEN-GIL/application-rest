<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importer un flux XML - SEPA26</title>
    <link rel="stylesheet" th:href="@{/sepa26.css}">
</head>
<body>

    <!-- Barre de navigation -->
    <div th:replace="~{fragments/layout :: nav}"></div>

    <header>
        <h1>Application de transfert SEPA</h1>
        <p><a th:href="@{/}">&larr; Retour à l'accueil</a></p>
    </header>
    
    <main class="container">
        <div class="form-container">
            <form id="transferForm">
                <div class="form-group">
                    <label for="serverUrl">URL du serveur :</label>
                    <input type="text" id="serverUrl" required>
                </div>

                <div class="form-group">
                    <label for="serverPort">Port :</label>
                    <input type="number" id="serverPort" value="8100" min="1" max="65535" required>
                </div>

                <div class="form-group">
                    <label for="endpoint">Endpoint cible :</label>
                    <input type="text" id="endpoint" value="/sepa26/insert" required>
                </div>

                <div class="form-group">
                    <label for="xmlFile">Fichier XML SEPA :</label>
                    <input type="file" id="xmlFile" accept=".xml" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="validateXml" checked>
                    <label for="validateXml">Valider le XML contre le schéma XSD avant transfert</label>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn">Transférer le flux</button>
                    <button type="button" class="btn btn-secondary" id="resetBtn">Réinitialiser</button>
                </div>
            </form>

            <div id="response" class="response">
                <h3 id="responseTitle">Résultat</h3>
                <p id="responseMessage"></p>
                <div id="responseDetails" class="response-details"></div>
            </div>
        </div>
    </main>
    
    <!-- Pied de page -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('transferForm');
        const resetBtn = document.getElementById('resetBtn');
        const serverUrl = document.getElementById('serverUrl');
        const serverPort = document.getElementById('serverPort');
        const endpoint = document.getElementById('endpoint');
        const xmlFile = document.getElementById('xmlFile');
        const validateXml = document.getElementById('validateXml');
        const response = document.getElementById('response');
        const responseTitle = document.getElementById('responseTitle');
        const responseMessage = document.getElementById('responseMessage');
        const responseDetails = document.getElementById('responseDetails');

        // Initialisation dynamique de l'URL du serveur
        serverUrl.value = window.location.protocol + '//' + window.location.hostname;
        serverPort.value = window.location.port || '8100';

        // Détection d'un éventuel flux converti en session
        const urlParams = new URLSearchParams(window.location.search);
        const fromConvert = urlParams.get('fromConvert') === 'true';
        let convertedXml = null;

        if (fromConvert) {
            convertedXml = sessionStorage.getItem('convertedXml');
            if (convertedXml) {
                showInfo('XML Converti', 'Utilisation du XML converti depuis l\'application de conversion. Vous pouvez maintenant le transférer vers le serveur.');
                xmlFile.removeAttribute('required');
            }
        }

        function processAndSendXml(xml) {
            if (validateXml.checked) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xml, 'text/xml');
                const parserError = xmlDoc.getElementsByTagName('parsererror');
                if (parserError.length > 0) {
                    showError('Erreur de syntaxe XML', 'Le fichier sélectionné n\'est pas un XML bien formé.', parserError[0].textContent);
                    return;
                }
            }

            const shouldValidate = validateXml.checked;
            const url = `${serverUrl.value}:${serverPort.value}${endpoint.value}?validate=${shouldValidate}`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/xml',
                    'Accept': 'application/xml'
                },
                body: xml
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`Erreur HTTP: ${res.status}`);
                }
                return res.text();
            })
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, 'text/xml');
                const status = xmlDoc.getElementsByTagName('status')[0]?.textContent;

                if (status === 'INSERTED') {
                    const id = xmlDoc.getElementsByTagName('id')[0]?.textContent;
                    showSuccess('Succès', `Le flux a été inséré avec succès. Identifiant créé : ${id}`, data);
                } else {
                    const desc = xmlDoc.getElementsByTagName('description')[0]?.textContent || 'Une erreur est survenue lors de l\'insertion.';
                    showError('Erreur d\'insertion', desc, data);
                }
            })
            .catch(err => {
                showError('Erreur de communication', 'Impossible de communiquer avec le serveur.', err.toString());
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (convertedXml) {
                processAndSendXml(convertedXml);
                return;
            }

            if (!xmlFile.files || xmlFile.files.length === 0) {
                showError('Erreur', 'Veuillez sélectionner un fichier XML.');
                return;
            }

            const file = xmlFile.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                processAndSendXml(e.target.result);
            };

            reader.onerror = function() {
                showError('Erreur de lecture', 'Impossible de lire le fichier XML local.');
            };

            reader.readAsText(file);
        });

        resetBtn.addEventListener('click', function() {
            form.reset();
            serverUrl.value = window.location.protocol + '//' + window.location.hostname;
            serverPort.value = window.location.port || '8100';
            response.style.display = 'none';
        });

        function showSuccess(title, message, details = '') {
            responseTitle.textContent = title;
            responseMessage.textContent = message;
            responseDetails.textContent = details;
            response.className = 'response success';
            response.style.display = 'block';
        }

        function showError(title, message, details = '') {
            responseTitle.textContent = title;
            responseMessage.textContent = message;
            responseDetails.textContent = details;
            response.className = 'response error';
            response.style.display = 'block';
        }

        function showInfo(title, message, details = '') {
            responseTitle.textContent = title;
            responseMessage.textContent = message;
            responseDetails.textContent = details;
            response.className = 'response';
            response.style.display = 'block';
        }
    });
    </script>
</body>
</html>
