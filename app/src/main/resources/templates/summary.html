<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résumé des transactions - SEPA26</title>
    <link rel="stylesheet" th:href="@{/sepa26.css}">
</head>
<body>

    <!-- Barre de navigation -->
    <div th:replace="~{fragments/layout :: nav}"></div>

    <header>
        <h1>Liste des 10 dernières transactions</h1>
        <p><a th:href="@{/}">&larr; Retour à l'accueil</a></p>
    </header>
    
    <main class="container">
        <div class="summary-container">
            <table class="doc-table">
                <thead>
                    <tr>
                        <th>Date d'émission</th>
                        <th>Identifiant (PmtId)</th>
                        <th>Montant total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc : ${documents}" th:if="${!#lists.isEmpty(documents)}">
                        <td th:text="${doc.cstmrDrctDbtInitn.grpHdr.creDtTm}">2026-01-01</td>
                        <td th:text="${doc.cstmrDrctDbtInitn.pmtInfs[0].drctDbtTxInfs[0].pmtId}">ID</td>
                        <td th:text="${#numbers.formatDecimal(doc.cstmrDrctDbtInitn.grpHdr.ctrlSum, 1, 2) + ' EUR'}">0.00 EUR</td>
                        <td>
                            <a class="btn btn-secondary" th:href="@{/sepa26/html/{id}(id=${doc.id})}">Voir (HTML)</a>
                            <a class="btn" th:href="@{/sepa26/xml/{id}(id=${doc.id})}">Voir (XML)</a>
                            <button class="btn btn-danger" th:data-id="${doc.id}" onclick="confirmDelete(this.getAttribute('data-id'))">Supprimer</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(documents)}">
                        <td colspan="4" class="no-doc">Aucune transaction enregistrée en base.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    
    <!-- Modal de confirmation de suppression -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 class="modal-title">Confirmer la suppression</h3>
            <p>Êtes-vous sûr de vouloir supprimer cette transaction ?</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Supprimer</button>
            </div>
        </div>
    </div>
    
    <!-- Pied de page -->
    <div th:replace="~{fragments/layout :: footer}"></div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        let idToDelete = null;

        window.confirmDelete = function(id) {
            idToDelete = id;
            deleteModal.style.display = 'block';
        };

        window.closeModal = function() {
            deleteModal.style.display = 'none';
        };

        confirmDeleteBtn.addEventListener('click', function() {
            if (idToDelete) {
                fetch(`/sepa26/delete/${idToDelete}`, {
                    method: 'DELETE'
                })
                .then(res => res.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data, 'text/xml');
                    const status = xmlDoc.getElementsByTagName('status')[0]?.textContent;

                    if (status === 'DELETED') {
                        window.location.reload();
                    } else {
                        alert('Erreur lors de la suppression de la transaction.');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('Une erreur est survenue lors de la communication avec le serveur.');
                })
                .finally(() => {
                    closeModal();
                });
            }
        });

        window.onclick = function(event) {
            if (event.target === deleteModal) {
                closeModal();
            }
        };
    });
    </script>
</body>
</html>
