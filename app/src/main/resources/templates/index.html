<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Projet SEPA26</title>
    <link rel="stylesheet" th:href="@{/sepa26.css}">
</head>
<body>

    <!-- Barre de navigation -->
    <div th:replace="~{fragments/layout :: nav}"></div>
    
    <main class="container">
        <div class="welcome">
            <img th:src="${universityLogo}" alt="Logo Université de Rouen" width="220">
            <h1>Bienvenue sur le service REST SEPA26</h1>
            <p>Gestion et traitement de virements conformes à la norme ISO 20022</p>
            
            <div class="project-info">
                <p><strong>Nom du projet :</strong> <span th:text="${projectName}">SEPA26</span></p>
                <p><strong>Version :</strong> <span th:text="${version}">1.0.0</span></p>
                <p><strong>Développeurs :</strong> <span th:text="${developer}">Florian Pépin &amp; Umm-Habibah Ouattara</span></p>
            </div>
        </div>
    </main>
    
    <!-- Pied de page -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
